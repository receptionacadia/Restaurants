<!-- window.storage polyfill using localStorage (per offrire compatibilità con codice generato in ambiente Claude) -->
<script>
(function(){
  if (typeof window === 'undefined') return;
  if (window.storage) return; // già definito
  const PREFIX = 'alpstay::';
  window.storage = {
    async get(key) {
      try {
        const v = localStorage.getItem(PREFIX + key);
        if (v === null) return null;
        return { key: key, value: v };
      } catch(e) { return null; }
    },
    async set(key, value) {
      try {
        localStorage.setItem(PREFIX + key, String(value));
        return { key: key, value: String(value) };
      } catch(e) { return null; }
    },
    async delete(key) {
      try {
        localStorage.removeItem(PREFIX + key);
        return { key: key, deleted: true };
      } catch(e) { return null; }
    },
    async list(prefix) {
      try {
        const out = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX)) {
            const short = k.slice(PREFIX.length);
            if (!prefix || short.startsWith(prefix)) out.push(short);
          }
        }
        return { keys: out, prefix: prefix || '' };
      } catch(e) { return null; }
    }
  };
})();
</script>

const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');
`;

const CSS = `
:root{
  --gold:#A67C52;--gold-b:#8A6240;--gold-light:#C4A882;--gold-pale:#EDE0CC;
  --gold-bg:#FAF7F2;--gold-rule:#D4C4A8;
  --dark:#1A1A1A;--dark2:#2C2C2C;
  --white:#FFFFFF;--cream:#FDFBF8;
  --text:#2A2420;--muted:#8A7E74;--subtle:#B4A898;
  --border:#E8E0D4;--border2:#D8CFC4;
  --r:10px;--r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat','Noto Sans SC',sans-serif;background:var(--cream);color:var(--text);}
.app{min-height:100vh;}
.hdr-top-bar{background:var(--dark);padding:.45rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.hdr-top-left{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:400;}
.hdr-top-right{display:flex;align-items:center;gap:.75rem;}
.lang-switcher{display:flex;gap:.3rem;align-items:center;}
.lang-pill{background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:4px;color:rgba(255,255,255,.5);font-size:.6rem;font-weight:600;letter-spacing:.08em;padding:.26rem .55rem;cursor:pointer;font-family:'Montserrat',sans-serif;transition:all .2s;text-transform:uppercase;}
.lang-pill:hover{border-color:var(--gold-light);color:var(--gold-light);}
.lang-pill.active{background:var(--gold);border-color:var(--gold);color:var(--white);}
.hdr-gear{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;color:rgba(255,255,255,.5);font-size:.8rem;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.hdr-gear:hover{border-color:var(--gold-light);color:var(--gold-light);}
.hdr-logo{padding:2rem 1.5rem 1.4rem;text-align:center;background:var(--white);}
.logo-service{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:300;font-style:italic;color:var(--muted);letter-spacing:.12em;display:block;margin-top:.3rem;margin-bottom:.4rem;}
.logo-rule{width:48px;height:1px;background:var(--gold-rule);margin:.6rem auto;}
.logo-tagline{font-size:.58rem;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);}
.cfg-warn{background:var(--gold-bg);border-bottom:1px solid var(--gold-pale);padding:.55rem 1rem;text-align:center;font-size:.72rem;color:var(--gold-b);cursor:pointer;letter-spacing:.04em;font-weight:400;}
.steps{display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--white);border-bottom:1px solid var(--border);gap:0;overflow-x:auto;}
.st-item{display:flex;align-items:center;gap:.4rem;white-space:nowrap;}
.st-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;flex-shrink:0;transition:all .25s;border:1px solid transparent;}
.st-num.done{background:var(--gold);border-color:var(--gold);color:var(--white);}
.st-num.active{background:var(--dark);border-color:var(--dark);color:var(--white);}
.st-num.todo{background:transparent;border-color:var(--border2);color:var(--subtle);}
.st-lbl{font-size:.56rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle);}
.st-lbl.active{color:var(--dark);}
.st-line{width:22px;height:1px;background:var(--border);margin:0 .3rem;flex-shrink:0;}
@media(max-width:380px){.st-lbl{display:none;}.st-line{width:10px;}}
.content{max-width:880px;margin:0 auto;padding:2.5rem 1rem 5rem;}

// Copy text to clipboard
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Fallback: create textarea
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }
}

// Open mailto: with pre-filled content (works on all devices/email clients)
function openMailto(to, subject, body) {
  const maxLen = 1800; // safe URL length for most email clients
  const shortBody = body.length > maxLen ? body.slice(0, maxLen) + "\n\n[...]" : body;
  const url = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(shortBody)}`;
  window.open(url, "_blank");
}

// ─── BOOKING NUMBER ────────────────────────────────────────────────────────────
async function getNextBookingNumber() {
  try {
    const result = await window.storage?.get("booking-counter");
    const counter = result ? parseInt(result.value) : 421;
    await window.storage?.set("booking-counter", String(counter + 1));
    const year = new Date().getFullYear();
    return `${year}/${String(counter).padStart(3,"0")}`;
  } catch {
    const counter = 421 + Math.floor(Date.now() % 1000);
    return `${new Date().getFullYear()}/${String(counter).padStart(3,"0")}`;
  }
}

  const currentTo = isGuest ? ce.subject.split("]")[1]?.trim() || ce.subject : "ezioprinoth@gmail.com";

  const labels = {
    title: {it:"📧 Email generate",de:"📧 Generierte E-Mails",en:"📧 Generated Emails",zh:"📧 生成的邮件"},
    guest: {it:"Cliente",de:"Gast",en:"Guest",zh:"客人"},
    admin: {it:"Admin",de:"Admin",en:"Admin",zh:"管理"},
    copy: {it:"Copia testo",de:"Text kopieren",en:"Copy text",zh:"复制文本"},
    copied: {it:"✓ Copiato!",de:"✓ Kopiert!",en:"✓ Copied!",zh:"✓ 已复制"},
    open: {it:"Apri email",de:"E-Mail öffnen",en:"Open email",zh:"打开邮件"},
    note: {
      it:"Incolla il testo nel tuo client email e invia a",
      de:"Text in Ihr E-Mail-Programm einfügen und senden an",
      en:"Paste the text into your email client and send to",
      zh:"将文本粘贴到您的邮件客户端并发送至"
    }
  };
  const L = l => labels[l]?.[lang] || labels[l]?.en || "";

  const handleCopy = async () => {
    const full = `To: ${isGuest?"[email cliente]":"ezioprinoth@gmail.com"}\nSubject: ${current.subject}\n\n${current.body}`;
    const ok = await copyToClipboard(full);
    if (ok) { setCopied(emailTab); setTimeout(()=>setCopied(""), 2500); }
  };

  const handleOpen = () => openMailto(
    isGuest ? "" : "ezioprinoth@gmail.com",
    current.subject, current.body
  );

  return (
    <div className="email-panel">
      <div className="email-panel-header">
        <span className="email-panel-title">{L("title")}</span>
        <div className="email-tabs">
          {["guest","admin"].map(tab=>(
            <button key={tab} className={`email-tab${emailTab===tab?" active":""}`}
              onClick={()=>setEmailTab(tab)}>
              {tab==="guest"?L("guest"):L("admin")}
            </button>
          ))}
        </div>
      </div>
      <div className="email-body-text">
        <b>Subject: {current.subject}</b>{" \n\n"}{current.body}
      </div>
      <div className="email-actions">
        <button className={`btn-email-action btn-copy${copied===emailTab?" done":""}`}
          onClick={handleCopy}>
          {copied===emailTab ? L("copied") : "📋 "+L("copy")}

        <button className="btn-email-action btn-mailto" onClick={handleOpen}>
          ✉️ {L("open")}
        </button>
      </div>
      <div className="email-note">
        {L("note")} {isGuest?"<email cliente>":"ezioprinoth@gmail.com"}
      </div>
    </div>
  );
}

// ─── MAIN ─────────────────────────────────────────────────────────────────────
function AlpstayMobility() {
  const [lang, setLang] = useState("it");
  const s = S[lang];
  const [step, setStep] = useState(1);
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState(null);
  const [errors, setErrors] = useState({});
  const [showSetup, setShowSetup] = useState(false);
  const [showConditions, setShowConditions] = useState(false);
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [emailContent, setEmailContent] = useState(null);
  const [emailTab, setEmailTab] = useState("guest");
  const [copied, setCopied] = useState("");
  const [cfg, setCfg] = useState(null);

  const [b, setB] = useState({
    vehicleId:null, vehicleQty:1, duration:null, date:"", time:null, pickupAddress:"", addons:[], bookingNumber:null,
    nome:"", cognome:"", dataNascita:"", luogoNascita:"",
    numPatente:"", scadenzaPatente:"", entePatente:"", nazionePatente:"Italia",
    email:"", cellulare:"", acceptPrivacy:false, acceptConditions:false,
  });

  useEffect(()=>{ window.storage?.get("emailjs-config").then(r=>{ if(r?.value) setCfg(JSON.parse(r.value)); }).catch(()=>{}); },[]);
  const saveCfg = nc => { setCfg(nc); window.storage?.set("emailjs-config",JSON.stringify(nc)).catch(()=>{}); setShowSetup(false); };
  const upd = (k,v) => { setB(p=>({...p,[k]:v})); setErrors(e=>({...e,[k]:null})); };
  const vehicle = useMemo(()=>VEHICLES.find(v=>v.id===b.vehicleId),[b.vehicleId]);
  const isJag = b.vehicleId==="jaguar";
  const slots = useMemo(()=>b.duration?timeSlots(b.duration):[],[b.duration]);
  const vehicleIsVespa = b.vehicleId==="vespa";
  const price = useMemo(()=>vehicle&&b.duration?(vehicle.prices[b.duration]*(vehicleIsVespa?b.vehicleQty:1)):null,[vehicle,b.duration,b.vehicleQty,vehicleIsVespa]);
  const addonTotal = useMemo(()=>b.addons.reduce((s,id)=>{const a=ADDONS.find(x=>x.id===id);return s+(a?.price||0);},0),[b.addons]);
  const grandTotal = useMemo(()=>(price||0)+addonTotal,[price,addonTotal]);

  const validate = {
    1:()=>{ if(!b.vehicleId){setErrors({vehicleId:s.eVeh});return false;} return true; },
    2:()=>true,
    3:()=>{ const e={}; if(!b.date)e.date=s.eReq; if(!b.duration)e.duration=s.eDur; if(!b.time)e.time=s.eTime; if(isJag&&!b.pickupAddress.trim())e.pickupAddress=s.ePick; setErrors(e); return!Object.keys(e).length; },
    4:()=>{ const e={}; ["nome","cognome","dataNascita","luogoNascita","email","cellulare"].forEach(f=>{if(!b[f])e[f]=s.eReq;}); if(!isJag)["numPatente","scadenzaPatente","entePatente","nazionePatente"].forEach(f=>{if(!b[f])e[f]=s.eReq;}); if(b.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email))e.email=s.eEmail; setErrors(e); return!Object.keys(e).length; },
    5:()=>{ const e={}; if(!b.acceptPrivacy)e.acceptPrivacy=s.ePriv; if(!b.acceptConditions)e.acceptConditions=s.eCond; setErrors(e); return!Object.keys(e).length; },
  };
  const handleNext = () => { if(validate[step]()) setStep(st=>st+1); };
  const handleSubmit = async () => {
    if(!validate[5]()) return;
    setSending(true); setSendError(null);
    try {
      const bookingNum = await getNextBookingNumber();
      const bWithNum = {...b, bookingNumber: bookingNum};
      upd("bookingNumber", bookingNum);
      const ce = buildCustomerEmail(bWithNum, vehicle, lang, grandTotal, addonTotal, b.addons);
      const ae = buildAdminEmail(bWithNum, vehicle, grandTotal, b.addons);
      setEmailContent({ ce, ae });
      setSent(true);
    } catch(err) {
      console.error("Booking error:", err);
      setSendError(lang==="de"
        ? `Fehler: ${err.message} — Bitte prüfen Sie Ihre Internetverbindung.`
        : lang==="en"
        ? `Error: ${err.message} — Please check your internet connection.`
        : lang==="zh"
        ? `错误: ${err.message} — 请检查您的网络连接。`
        : `Errore: ${err.message} — Verificare la connessione internet.`);
    } finally { setSending(false); }
  };
  const reset = () => { setSent(false); setStep(1); setEmailContent(null); setEmailTab("guest"); setCopied(""); setB({vehicleId:null,vehicleQty:1,duration:null,date:"",time:null,pickupAddress:"",addons:[],bookingNumber:null,nome:"",cognome:"",dataNascita:"",luogoNascita:"",numPatente:"",scadenzaPatente:"",entePatente:"",nazionePatente:"Italia",email:"",cellulare:"",acceptPrivacy:false,acceptConditions:false}); };

  const VehicleHead = ({v}) => (

        ? <img src={IMG[v.photoImg]} alt={v.name}
            style={{width:"100%",height:"100%",objectFit:"cover",
                    objectPosition:v.photoPos||"center",display:"block"}}/>

                       alignItems:"center",justifyContent:"center"}}>

  const Header = () => (
    <>
      <div className="hdr-top-bar">
        <span className="hdr-top-left">Smart Hotel Saslong · Santa Cristina · Val Gardena</span>

          <div className="lang-switcher">
            {["it","de","en","zh"].map(l=>(
              <button key={l} className={`lang-pill${lang===l?" active":""}`}
                onClick={()=>setLang(l)}>
                {l==="it"?"IT":l==="de"?"DE":l==="en"?"EN":"中"}

          </div>
          <div className="hdr-gear" onClick={()=>setShowSetup(true)} title="Setup">⚙</div>
        </div>
      </div>
      <div className="hdr-logo">
        <AlpstayLogo width={220}/>
        <span className="logo-service">Mobility</span>
      </div>
    </>
  );

  if(sent) return (
    <div className="app"><style>{FONTS+CSS}</style>
      <div style={{background:"var(--white)",borderBottom:"1px solid var(--border)"}}>
        <Header/>
      </div>
      <div className="content"><div className="success">
        <div className="suc-icon">✓</div>
        <AlpstayLogo width={200}/>
        <div className="suc-rule"/>
        <h2 className="suc-title">{s.sucTitle}</h2>
        <p className="suc-sub">{s.sucSub(b.email)}</p>
        {b.bookingNumber&&<div style={{display:"inline-block",background:"var(--gold-bg)",border:"1.5px solid var(--gold-pale)",borderRadius:"8px",padding:".5rem 1.2rem",marginBottom:"1.5rem"}}>
          <span style={{fontSize:".62rem",fontWeight:600,textTransform:"uppercase",letterSpacing:".12em",color:"var(--gold)",display:"block",marginBottom:".15rem"}}>
            {{"it":"N° Prenotazione","de":"Buchungsnummer","en":"Booking Number","zh":"预订号码"}[lang]}
          </span>
          <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.4rem",fontWeight:700,color:"var(--dark)",letterSpacing:".08em"}}>
            {b.bookingNumber}
          </span>
        </div>}
        <div className="info-box"><div className="info-box-t">{s.sucVeh(vehicle,lang)}</div>
          <p>{b.date} · {b.time} → {endTime(b.time,b.duration)} · {b.duration} {s.ore}<br/>
          <strong style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.2rem",color:"var(--gold)",fontWeight:600}}>{fmt(price)}</strong> (IVA incl.)</p>

        <div className="pickup-callout" style={{maxWidth:520,margin:"0 auto .9rem",textAlign:"left"}}>

        <EmailPanel emailContent={emailContent} lang={lang} emailTab={emailTab}

          {errors.vehicleId&&<div className="alert">⚠ {errors.vehicleId}</div>}

                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {addonTotal>0&&(
            <div className="addon-total-bar">
              <span className="addon-total-lbl">
                {{"it":"Totale extra","de":"Extras gesamt","en":"Extras total","zh":"附加合计"}[lang]}
              </span>
              <span className="addon-total-val">{fmt(addonTotal)}</span>
            </div>
          )}

          <div className="addon-skip">
            <span onClick={handleNext}>
              {{"it":"Salta — continua senza extra →","de":"Überspringen — ohne Extras weiter →","en":"Skip — continue without extras →","zh":"跳过 — 不添加附加继续 →"}[lang]||"Skip"}
            </span>
          </div>

          <div className="btn-row">
            <button className="btn-s" onClick={()=>setStep(1)}>{s.btnBack}</button>
            <button className="btn-p" onClick={handleNext}>{s.btnNext} →</button>
          </div>
        </>}

        {step===3&&<>
          <h2 className="sec-title">{s.dat_t}</h2>
          <p className="sec-sub">{s.dat_s(vehicle,lang)}</p>
          <div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">📅 {s.dateL}</label>{errors.date&&<span className="lbl-err">⚠ {errors.date}</span>}</div>
            <input type="date" className={`finp${errors.date?" err":""}`} min={today} value={b.date} onChange={e=>upd("date",e.target.value)} style={{maxWidth:230}}/>
          </div>
          <div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">⏱ {s.durL}</label>{errors.duration&&<span className="lbl-err">⚠ {errors.duration}</span>}</div>
            <div className="opt-grid">{[2,4,6].map(d=>(
              <button key={d} className={`opt-btn${b.duration===d?" sel":""}`} onClick={()=>{upd("duration",d);upd("time",null);}}>
                {d} {s.ore}
                <span className="opt-price">{fmt(vehicle?.prices[d])}</span>
                {d===6&&<span style={{display:"block",fontSize:".55rem",marginTop:".15rem",opacity:.85}}>🧺 +picnic</span>}
              </button>
            ))}</div>
            {b.duration===6&&<div className="picnic-alert">🧺 {s.picnicShort}</div>}
          </div>
          {b.duration&&<div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">🕐 {s.timeL}</label>{errors.time&&<span className="lbl-err">⚠ {errors.time}</span>}</div>
            <div className="time-grid">{slots.map(t=><button key={t} className={`t-btn${b.time===t?" sel":""}`} onClick={()=>upd("time",t)}>{t}</button>)}</div>
            {b.time&&<div className="alert">{s.timeAlert(b.time, endTime(b.time,b.duration))}</div>}
          </div>}
          {isJag&&<div style={{marginBottom:"1.3rem"}}>
            <div className="lbl-row"><label className="flbl">📍 {s.pickL}</label>{errors.pickupAddress&&<span className="lbl-err">⚠ {errors.pickupAddress}</span>}</div>
            <input className={`finp${errors.pickupAddress?" err":""}`} placeholder={s.pickPh} value={b.pickupAddress} onChange={e=>upd("pickupAddress",e.target.value)}/>
            <p style={{fontSize:".72rem",color:"var(--muted)",marginTop:".38rem",fontWeight:300}}>{s.pickH}</p>
          </div>}
          <div className="btn-row"><button className="btn-s" onClick={()=>setStep(2)}>← {s.btnBack}</button><button className="btn-p" onClick={handleNext}>{s.btnNext} →</button></div>
        </>}

        {step===4&&<>
          <h2 className="sec-title">{s.s3t}</h2>
          <p className="sec-sub">{s.s3s}</p>
          <div className="form-grid">
            <div className="fg"><label className="flbl">{s.nome} *</label><input className={`finp${errors.nome?" err":""}`} value={b.nome} onChange={e=>upd("nome",e.target.value)}/>{errors.nome&&<span className="ferr">{errors.nome}</span>}</div>
            <div className="fg"><label className="flbl">{s.cogn} *</label><input className={`finp${errors.cognome?" err":""}`} value={b.cognome} onChange={e=>upd("cognome",e.target.value)}/>{errors.cognome&&<span className="ferr">{errors.cognome}</span>}</div>
            <div className="fg"><label className="flbl">{s.dob} *</label><input type="date" className={`finp${errors.dataNascita?" err":""}`} value={b.dataNascita} onChange={e=>upd("dataNascita",e.target.value)}/>{errors.dataNascita&&<span className="ferr">{errors.dataNascita}</span>}</div>
            <div className="fg"><label className="flbl">{s.pob} *</label><input className={`finp${errors.luogoNascita?" err":""}`} value={b.luogoNascita} onChange={e=>upd("luogoNascita",e.target.value)}/>{errors.luogoNascita&&<span className="ferr">{errors.luogoNascita}</span>}</div>
            <div className="fg"><label className="flbl">{s.email} *</label><input type="email" className={`finp${errors.email?" err":""}`} value={b.email} onChange={e=>upd("email",e.target.value)}/>{errors.email&&<span className="ferr">{errors.email}</span>}</div>
            <div className="fg"><label className="flbl">{s.phone} *</label><input type="tel" className={`finp${errors.cellulare?" err":""}`} value={b.cellulare} onChange={e=>upd("cellulare",e.target.value)}/>{errors.cellulare&&<span className="ferr">{errors.cellulare}</span>}</div>
            {!isJag&&<>
              <div className="fg full"><div className="fsect">{s.licSec(vehicle)}</div></div>
              <div className="fg"><label className="flbl">{s.licNum} *</label><input className={`finp${errors.numPatente?" err":""}`} placeholder="AB1234567C" value={b.numPatente} onChange={e=>upd("numPatente",e.target.value)}/>{errors.numPatente&&<span className="ferr">{errors.numPatente}</span>}</div>
              <div className="fg"><label className="flbl">{s.licExp} *</label><input type="date" className={`finp${errors.scadenzaPatente?" err":""}`} min={today} value={b.scadenzaPatente} onChange={e=>upd("scadenzaPatente",e.target.value)}/>{errors.scadenzaPatente&&<span className="ferr">{errors.scadenzaPatente}</span>}</div>
              <div className="fg"><label className="flbl">{s.licAuth} *</label><input className={`finp${errors.entePatente?" err":""}`} value={b.entePatente} onChange={e=>upd("entePatente",e.target.value)}/>{errors.entePatente&&<span className="ferr">{errors.entePatente}</span>}</div>
              <div className="fg"><label className="flbl">{s.licNat} *</label><input className={`finp${errors.nazionePatente?" err":""}`} value={b.nazionePatente} onChange={e=>upd("nazionePatente",e.target.value)}/>{errors.nazionePatente&&<span className="ferr">{errors.nazionePatente}</span>}</div>
            </>}
          </div>
          <div className="btn-row"><button className="btn-s" onClick={()=>setStep(2)}>← {s.btnBack}</button><button className="btn-p" onClick={handleNext}>{s.btnSum} →</button></div>
        </>}

        {step===5&&<>
          <h2 className="sec-title">{s.s4t}</h2>
          <p className="sec-sub">{s.s4s}</p>
          <div className="sum-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".9rem",flexWrap:"wrap",gap:".5rem"}}>
              <div className="sum-veh" style={{margin:0}}>
              {vehicleIsVespa&&b.vehicleQty===2?"2× ":""}{vehicle?.name} — {vt(vehicle,"subtitles",lang)}
            </div>
              {b.bookingNumber&&<div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:".88rem",color:"var(--gold-light)",letterSpacing:".1em",fontWeight:600,whiteSpace:"nowrap"}}>
                N° {b.bookingNumber}
              </div>}
            </div>
            {b.bookingNumber&&<div className="sum-row">
              <span className="sum-lbl">{{"it":"N° Prenotazione","de":"Buchungsnummer","en":"Booking No.","zh":"预订号码"}[lang]||"N°"}</span>
              <span className="sum-val" style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"1.05rem",color:"var(--gold-light)",fontWeight:600,letterSpacing:".06em"}}>{b.bookingNumber}</span>
            </div>}
            <div className="sum-row"><span className="sum-lbl">{s.rCliente}</span><span className="sum-val">{b.nome} {b.cognome}</span></div>
            <div className="sum-row"><span className="sum-lbl">{s.rData}</span><span className="sum-val">{b.date}</span></div>
            <div className="sum-row"><span className="sum-lbl">{s.rOrario}</span><span className="sum-val">{b.time} → {endTime(b.time,b.duration)} ({b.duration} {s.ore})</span></div>
            {isJag&&<div className="sum-row"><span className="sum-lbl">{s.rPartenza}</span><span className="sum-val">{b.pickupAddress}</span></div>}
            {!isJag&&<div className="sum-row"><span className="sum-lbl">{s.rRitiro}</span><span className="sum-val">{s.rAddr}</span></div>}
            {b.duration===6&&<div className="sum-row"><span className="sum-lbl">🧺 Picnic</span><span className="sum-val" style={{color:"var(--gold)",fontWeight:500}}>{s.picnicShort}</span></div>}
            {b.addons.length>0&&b.addons.map(id=>{const a=ADDONS.find(x=>x.id===id);return a?(<div className="sum-row" key={id}><span className="sum-lbl">{a.icon} {vt(a,"names",lang)}</span><span className="sum-val" style={{color:"var(--gold-light)"}}>{fmt(a.price)}</span></div>):null;})}
            {b.addons.length>0&&<div className="sum-row"><span className="sum-lbl">{{"it":"Totale mezzo","de":"Fahrzeug","en":"Vehicle","zh":"车辆"}[lang]}</span><span className="sum-val">{fmt(price)}</span></div>}
            <div className="sum-row"><span className="sum-lbl">{s.rTotale}</span><span className="sum-price">{fmt(grandTotal)}</span></div>
          </div>
          <div className="terms-box">
            <label className="ck-row"><input type="checkbox" checked={b.acceptPrivacy} onChange={e=>upd("acceptPrivacy",e.target.checked)}/>
            <span className="ck-txt">
              <span dangerouslySetInnerHTML={{__html:s.privTxt}}/>
              {" "}<span className="cond-link" onClick={e=>{e.preventDefault();setShowPrivacy(true);}}>
                {{"it":"→ Leggi l'informativa completa","de":"→ Vollständige Datenschutzerklärung","en":"→ Read full privacy notice","zh":"→ 阅读完整隐私政策"}[lang]||"→ Read"}
              </span>
            </span></label>
            {errors.acceptPrivacy&&<p className="ferr" style={{marginTop:".4rem"}}>⚠ {errors.acceptPrivacy}</p>}
          </div>
          <div className="terms-box">
            <label className="ck-row"><input type="checkbox" checked={b.acceptConditions} onChange={e=>upd("acceptConditions",e.target.checked)}/>
            <span className="ck-txt">
              <span dangerouslySetInnerHTML={{__html:s.condTxt}}/>
              {" "}<span className="cond-link" onClick={e=>{e.preventDefault();setShowConditions(true);}}>
                {{"it":"→ Leggi il testo completo","de":"→ Vollständigen Text lesen","en":"→ Read full text","zh":"→ 阅读完整条款"}[lang]||"→ Read"}
              </span>
            </span></label>
            {errors.acceptConditions&&<p className="ferr" style={{marginTop:".4rem"}}>⚠ {errors.acceptConditions}</p>}
          </div>
          {!isJag&&<div style={{marginBottom:"1.4rem"}}>
            <label className="flbl" style={{display:"block",marginBottom:".45rem"}}>📍 {s.pickPt}</label>
            <p style={{fontSize:".78rem",color:"var(--muted)",marginBottom:".65rem",fontWeight:300}}>{s.pickPtAddr}</p>
            <div className="map-card">
              <div className="map-card-info">
                <span className="map-card-name">Smart Hotel Saslong</span>
                <span className="map-card-addr">Via Pallua 40 · 39047 Santa Cristina Valgardena (BZ)</span>
                <span className="map-card-tel">+39 0471 774444</span>
              </div>
              <a href="https://www.google.com/maps/place/Smart+Hotel+Saslong/@46.5574,11.7476,17z"
                target="_blank" rel="noreferrer" className="btn-map-link">
                {{"it":"Apri in Google Maps","de":"In Google Maps öffnen","en":"Open in Google Maps","zh":"在谷歌地图中打开"}[lang]}
              </a>
            </div>
          </div>}
          {sendError&&<div className="alert-err">⚠ {sendError}</div>}
          <div className="btn-row">
            <button className="btn-s" onClick={()=>setStep(3)}>← {s.btnBack}</button>
            <button className="btn-p" onClick={handleSubmit} disabled={sending} style={{minWidth:240}}>
              {sending?s.btnSending:s.btnConf}
            </button>
          </div>
          <div className="divider"/>

          {/* Pickup callout */}
          <div className="pickup-callout">
            {isJag&&<div className="pickup-callout-icon">🐆</div>}
            <div className="pickup-callout-text">
              <span className="pickup-callout-title">{isJag?s.footJag:s.footKey}</span>
              {!isJag&&<span className="pickup-callout-sub">
                Smart Hotel Saslong · Via Pallua 40 · 39047 Santa Cristina · +39 0471 774444
              </span>}
            </div>
          </div>

          <p className="footer-note">{s.foot(b.email)}<br/>Saslong Srl · Via Rezia 308 · 39046 Ortisei (BZ) · www.alpstay.eu</p>
        </>}
      </div>
      {showSetup&&<SetupModal cfg={cfg} onSave={saveCfg} onClose={()=>setShowSetup(false)} s={s}/>}
      {showConditions&&<ConditionsModal lang={lang} onClose={()=>setShowConditions(false)}/>}
      {showPrivacy&&<PrivacyModal lang={lang} onClose={()=>setShowPrivacy(false)}/>}
    </div>
  );
}


// ─── MOUNT ───────────────────────────────────────────────────────────────────
const _alpstay_container = document.getElementById('root');
const _alpstay_root = ReactDOM.createRoot(_alpstay_container);
_alpstay_root.render(<AlpstayMobility />);

// Hide loader once React has rendered
setTimeout(() => {
  const loader = document.getElementById('loader');
  if (loader) {
    loader.style.transition = 'opacity 0.3s ease';
    loader.style.opacity = '0';
    setTimeout(() => loader.remove(), 300);
  }
}, 100);
</script>

</body>
</html>
